<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AarnaAI - Smart Trading</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Rajdhani:wght@600;700&family=Space+Mono&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        h1, h2, h3, h4, .logo {
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .metric-value, .value, #dataset-table, #forecast-table {
            font-family: 'Space Mono', monospace;
        }J
        .candlestick-loader {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 30px;
            gap: 6px;
            margin: 0 auto 1rem auto;
            position: relative;
        }
        .candle {
            width: 6px;
            height: 18px;
            background: #00ff9d;
            position: relative;
            animation: fluctuate 1.2s infinite ease-in-out alternate;
            box-shadow: 0 0 8px rgba(0, 255, 157, 0.3);
        }
        .candle:nth-child(2) {
            background: #ff3366;
            box-shadow: 0 0 8px rgba(255, 51, 102, 0.3);
            animation-delay: -0.4s;
            height: 28px;
        }
        .candle:nth-child(3) {
            background: #00b8ff;
            box-shadow: 0 0 8px rgba(0, 184, 255, 0.3);
            animation-delay: -0.8s;
            height: 14px;
        }
        /* Wicks */
        .candle::before, .candle::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 1px;
            height: 8px;
            background: inherit;
            opacity: 0.7;
        }
        .candle::before { bottom: 100%; }
        .candle::after { top: 100%; }
        
        @keyframes fluctuate {
            0% { height: 10px; transform: translateY(2px); }
            100% { height: 30px; transform: translateY(-2px); }
        }
        /* Trading Mode Selector */
        .mode-selector {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin: 25px auto;
            padding: 10px;
            max-width: 600px;
        }
        .mode-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #aaa;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .mode-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .mode-btn.active {
            background: rgba(0, 255, 157, 0.15);
            color: #000000;
            border-color: #00ff9d;
            box-shadow: 0 0 15px rgba(0, 255, 157, 0.15);
        }
        /* Force Full Width for Chart */
        .section-chart {
            width: 100% !important;
            max-width: 100% !important;
            grid-column: 1 / -1;
        }
        .large-card {
            width: 100% !important;
        }
    </style>
</head>
<body>
    <div class="background-gradient"></div>
    <div class="ai-background-container">
        <div class="liquid-data-stream"></div>
    </div>
    <div id="cursor-glow"></div>
    
    <nav class="glass-nav">
        <div class="logo">
            <img src="/static/logo.png" alt="Logo" class="logo-img">
            AarnaAI
        </div>
        <div class="history-controls">
            <button onclick="toggleHistory()" class="secondary-btn"> Saved Reports</button>
        </div>
    </nav>

    <main class="container">
        <section class="hero">
            <div class="hero-content">
                <div class="hero-title-container">
                    <h1 class="hero-title">Aarna<span class="ai-text">AI</span></h1>
                    <div class="hero-tagline">
                        <span class="tagline-text">Share Market Prediction Model</span>
                        <span class="tagline-underline"></span>
                    </div>
                    <div class="hero-slogan">
                        <span class="slogan-text">Intelligence Amplified,</span>
                        <span class="slogan-text">Markets Deciphered</span>
                    </div>
                </div>
                <div class="hero-badge">
                    <span class="badge-text">PREMIUM EDITION</span>
                    <span class="badge-glow"></span>
                </div>
            </div>

    <!-- Saved Reports Modal -->
    <div id="history-dropdown" class="glass-panel hidden">
        <div class="history-header">
            <h3>Saved Reports</h3>
            <button onclick="toggleHistory()" class="close-history-btn">&times;</button>
        </div>
        <ul id="report-list"></ul>
    </div>

    <!-- News Modal -->
    <div id="news-modal" class="glass-panel hidden">
        <div class="history-header">
            <h3>Market News Sentiment</h3>
            <button onclick="closeNewsModal()" class="close-history-btn">&times;</button>
        </div>
        <ul id="modal-news-list" class="news-list"></ul>
    </div>

    <!-- TV Style News Ticker (Fixed Bottom) -->
    <div class="tv-news-container">
        <div class="tv-news-header">LIVE MARKET FEED</div>
        <div class="tv-news-content">
            <div id="tv-news-scroll" class="tv-news-scroll"></div>
        </div>
    </div>

    <script>
        // Intercept the fetch call to update the Trade Setup UI without modifying script.js
        const originalFetch = window.fetch;
        window.fetch = async function(...args) {
            const response = await originalFetch(...args);
            if (typeof args[0] === 'string' && args[0].includes('/api/analyze')) {
                const clone = response.clone();
                clone.json().then(data => {
                    if (data.trade_setup) {
                        const s = data.trade_setup;
                        const fmt = (n) => n ? parseFloat(n).toFixed(2) : "--";
                        
                        document.getElementById('trade-entry').innerText = fmt(s.entry);
                        document.getElementById('trade-sl').innerText = fmt(s.stop_loss);
                        document.getElementById('trade-target').innerText = fmt(s.target);
                        document.getElementById('trade-rr').innerText = s.rr_ratio || "--";
                        
                        document.getElementById('trade-support').innerText = s.supports && s.supports.length ? s.supports.map(n => parseFloat(n).toFixed(2)).join(', ') : "None";
                        document.getElementById('trade-resistance').innerText = s.resistances && s.resistances.length ? s.resistances.map(n => parseFloat(n).toFixed(2)).join(', ') : "None";
                        
                        const liqEl = document.getElementById('trade-liquidity');
                        liqEl.innerText = s.liquidity || "Neutral";
                        if (s.liquidity && s.liquidity.includes("Bullish")) liqEl.style.color = "#00C851";
                        else if (s.liquidity && s.liquidity.includes("Bearish")) liqEl.style.color = "#ff4444";
                        else liqEl.style.color = "#ffbb33";
                    }
                }).catch(e => console.error("Trade Setup Update Error:", e));
            }
            return response;
        };
    </script>
</body>
</html>
